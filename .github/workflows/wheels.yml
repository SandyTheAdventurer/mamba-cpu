name: Wheels

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Native runners for each target: Linux x86_64 / aarch64, macOS arm64, Windows x86_64.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v3.4.1
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  check_version:
    name: Tag matches package version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare tag with pyproject.toml
        run: |
          python - <<'EOF'
          import os, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if tag != version:
              sys.exit(f"Tag v{tag} does not match pyproject.toml version {version}")
          print(f"OK: {version}")
          EOF

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist, check_version]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing, no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
